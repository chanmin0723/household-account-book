name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config written"
          else
            echo "No GOOGLE_SERVICES_JSON secret — building without friend features"
          fi
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nabi-ledger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release (no login needed to download)
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk nabi-ledger.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" nabi-ledger.apk \
            --title "나비 가계부 $TAG" \
            --notes "커밋: ${{ github.sha }}" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
